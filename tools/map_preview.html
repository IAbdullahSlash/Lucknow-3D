<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hussainabad map preview</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#211922;color:#f4ead6;font:15px system-ui,sans-serif}
  main{padding:clamp(12px,3vw,32px)}
  h1{margin:0 0 10px;font:600 28px Georgia,serif}
  #maps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:12px}
  figure{margin:16px 0 0}
  figcaption{margin-bottom:5px}
  canvas{display:block;width:100%;height:auto;border:1px solid #a99474;border-radius:8px}
  a{color:#f4d2a0}
  label{display:inline-flex;flex-wrap:wrap;gap:6px}
</style>
</head>
<body>
<main>
<h1>Hussainabad map preview</h1>
<label>Compare a generated map <input id="compare" type="file" accept=".js,.json"></label>
<p id="status" role="status" hidden></p>
<div id="maps">
  <figure><figcaption id="baselineInfo">Checked-in extract</figcaption><canvas id="baseline" width="1600" height="1180" aria-label="Checked-in map of Hussainabad"></canvas></figure>
  <figure id="candidate" hidden><figcaption id="candidateInfo"></figcaption><canvas id="comparison" width="1600" height="1180" aria-label="Candidate map of Hussainabad"></canvas></figure>
</div>
<p>Map data © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a></p>
</main>
<script src="../data/map.js"></script>
<script src="map_preview.js"></script>
</body>
</html>
