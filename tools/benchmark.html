<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lucknow-3D benchmark</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#151119;color:#f4ead6;font:16px system-ui,sans-serif}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
  main{position:relative;margin:12px;padding:18px;max-width:620px;background:#211922;border:1px solid #6d5136;border-radius:12px}
  h1{margin:0;font:600 28px Georgia,serif}
  form{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
  button,select{font:inherit;padding:5px 8px}
  pre{overflow:auto;max-height:50vh}
  body.running main{max-width:max-content;padding:4px 12px;pointer-events:none}
  body.running :is(h1,form,#instructions){display:none}
</style>
</head>
<body>
<iframe id="sceneView" title="Lucknow-3D during the benchmark" hidden></iframe>
<main>
  <h1>Lucknow-3D benchmark</h1>
  <p id="instructions">Each run measures three 20-second passes through the heritage corridor. The optional shop passes repeat the same counter view at midday and at dusk in monsoon rain. Keep this tab visible.</p>
  <form id="settings">
    <label>Quality <select id="quality"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option></select></label>
    <label><input id="shops" type="checkbox"> Include shop passes</label>
    <label><input id="soak" type="checkbox"> Repeat after 10 minutes</label>
    <button>Run benchmark</button>
  </form>
  <p id="status" role="status"></p>
  <button id="save" hidden>Download results</button>
  <pre id="result" hidden></pre>
</main>
<script src="benchmark-page.js"></script>
</body>
</html>
